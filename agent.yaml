spec_version: "0.1.0"
name: grpc-protobuf-validator
version: 1.0.0
description: Protocol buffers schema evolution verification, grpc status code mapping, and wire compatibility validation.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - field-tag-preservation
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - developer-tools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/grpc-protobuf-validator"
